# Delta to merge into brain OpenAPI (project-specs/contracts/brain.openapi.yaml)
# Paths are relative to servers[0].url = /v1

paths:
  /projects/{projectId}/ingest:
    post:
      summary: Enqueue a document ingest job (FR-101)
      operationId: createIngestJob
      security: [ { adminAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, card]
              properties:
                file: { type: string, format: binary }
                card: { type: string, description: Target card slug }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestJob' }
        '401': { description: Unauthorized }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}/ingest/{jobId}:
    get:
      summary: Ingest job status (FR-108)
      operationId: getIngestJob
      security: [ { adminAuth: [] } ]
      parameters:
        - { $ref: '#/components/parameters/projectId' }
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestJob' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    IngestJob:
      type: object
      required: [id, status, card]
      properties:
        id: { type: string, format: uuid }
        card: { type: string }
        filename: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        summary:
          type: object
          properties:
            chunks: { type: integer }
            created: { type: integer }
            skipped: { type: integer }
            error: { type: string }
            reason: { type: string, description: empty_text | needs_ocr | ... }
